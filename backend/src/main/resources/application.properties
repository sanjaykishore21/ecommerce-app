# Server Configuration (Supports cloud PORT environment variable)
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration
# Spring Boot automatically auto-detects the correct Driver and Dialect from the JDBC URL prefix!
# - If SPRING_DATASOURCE_URL is empty: automatically uses built-in H2 (MySQL Mode)
# - If SPRING_DATASOURCE_URL is a Cloud MySQL URL: automatically uses MySQL Connector/J
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ecommerce_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f4c8b2d0a9e7f5c3b1a8d6e4f2b0c9a7e5d3f1b8a6c4e2d0f}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.ecommerce.app=INFO
logging.level.org.springframework.security=WARN
