# Server Configuration (Supports cloud PORT environment variable)
server.port=${PORT:8080}
server.servlet.context-path=/

# MySQL Database Configuration (Supports cloud DATABASE_URL / Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dbms}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f4c8b2d0a9e7f5c3b1a8d6e4f2b0c9a7e5d3f1b8a6c4e2d0f}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.ecommerce.app=INFO
logging.level.org.springframework.security=WARN
